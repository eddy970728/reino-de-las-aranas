name: Compilar Spider Kingdom (APK + AAB)

# Cada vez que subes cambios a main:
#  1. Prueba el juego en un navegador sin pantalla (si algo se rompe, no se compila).
#  2. Lo empaqueta con Capacitor como app Android que funciona sin Internet.
#  3. Saca dos archivos firmados con tu clave:
#       - spider-kingdom.apk  -> para instalarlo tú en el móvil y probarlo
#       - spider-kingdom.aab  -> el que se sube a Google Play Console
#  4. Los deja en la pestaña "Releases" del repo.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prueba de humo del juego
        run: |
          cd pruebas
          npm init -y >/dev/null
          npm install playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node humo.js ../index.html

  android:
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar web (www)
        run: |
          mkdir -p www
          cp index.html manifest.json icon-512.png www/
          VER=$(grep -o "VERSION='v[0-9.]*'" index.html | head -1 | grep -o "[0-9][0-9.]*")
          test -n "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Versión del juego: $VER"

      - name: Crear proyecto Android con Capacitor 8
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/app@8
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lunadoggybru.spiderkingdom",
            "appName": "Spider Kingdom",
            "webDir": "www",
            "backgroundColor": "#05070f",
            "android": { "allowMixedContent": false },
            "plugins": {
              "SystemBars": {
                "insetsHandling": "native",
                "initialViewportFitValueHint": "cover",
                "style": "DARK"
              }
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Versión, copia de seguridad e icono
        run: |
          # versionCode sube en cada compilación (Google Play lo exige); versionName es la del juego
          sed -i -E "s/versionCode [0-9]+/versionCode ${BUILD}/; s/versionName \"[^\"]*\"/versionName \"${VER}\"/" android/app/build.gradle
          grep -q "versionCode ${BUILD}" android/app/build.gradle
          grep -q "versionName \"${VER}\"" android/app/build.gradle
          # Copia de seguridad de Android: guarda las partidas en la cuenta de Google del jugador
          M=android/app/src/main/AndroidManifest.xml
          sed -i -E 's/android:allowBackup="[a-z]+"/android:allowBackup="true"/' "$M"
          grep -q 'android:allowBackup="true"' "$M" || sed -i 's/<application/<application android:allowBackup="true"/' "$M"
          grep -q 'android:allowBackup="true"' "$M"
          pip install pillow >/dev/null
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open("icon-512.png").convert("RGBA")
          res = "android/app/src/main/res"
          sizes = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216),
                   "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
          for d, (legacy, fg) in sizes.items():
              p = f"{res}/mipmap-{d}"
              if not os.path.isdir(p):
                  continue
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  src.resize((legacy, legacy), Image.LANCZOS).save(f"{p}/{name}")
              canvas = Image.new("RGBA", (fg, fg), (0, 0, 0, 0))
              inner = int(fg * 0.78)
              canvas.paste(src.resize((inner, inner), Image.LANCZOS), ((fg - inner) // 2,) * 2)
              canvas.save(f"{p}/ic_launcher_foreground.png")
          bg = f"{res}/values/ic_launcher_background.xml"
          if os.path.exists(bg):
              open(bg, "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0A1440</color>\n</resources>\n')
          PY

      - name: Compilar y firmar APK y AAB
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Faltan los secrets KEYSTORE_BASE64 y KEYSTORE_PASSWORD"; exit 1
          fi
          ./gradlew assembleRelease bundleRelease --no-daemon
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/reino.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/reino.keystore" --ks-key-alias reino \
            --ks-pass env:KEYSTORE_PASSWORD --out ../spider-kingdom.apk "$RUNNER_TEMP/aligned.apk"
          cp app/build/outputs/bundle/release/app-release.aab ../spider-kingdom.aab
          jarsigner -keystore "$RUNNER_TEMP/reino.keystore" -storepass:env KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 ../spider-kingdom.aab reino
          jarsigner -verify ../spider-kingdom.aab >/dev/null
          rm -f "$RUNNER_TEMP/reino.keystore"
          echo "### Spider Kingdom ${VER} (compilación ${BUILD})" >> "$GITHUB_STEP_SUMMARY"
          echo "- spider-kingdom.apk: para instalar en tu móvil" >> "$GITHUB_STEP_SUMMARY"
          echo "- spider-kingdom.aab: para subir a Google Play Console" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VER}-b${BUILD}" spider-kingdom.apk spider-kingdom.aab \
            --title "Spider Kingdom ${VER} · compilación ${BUILD}" \
            --notes "Compilada desde el commit ${GITHUB_SHA::7}. El .apk es para probar en tu móvil; el .aab es el que se sube a Google Play." \
            --latest
