<script>
const W=240,H=160,cv=document.getElementById('cv'),X=cv.getContext('2d');cv.width=W;cv.height=H;
const hv=document.getElementById('hv'),XH=hv.getContext('2d');let VWC=176,VHC=360;let HVS=0;
let PS=2,GR=1;
const uc=document.createElement('canvas');uc.width=W*2;uc.height=H*2;const U=uc.getContext('2d');let c=X;
const R=(x,y,w,h,k)=>{if(SHD&&k&&k.charCodeAt(0)==35)k=AMZ(k);if(c.__s!==k){c.fillStyle=k;c.__s=k}if(GR==1)c.fillRect(Math.round(x),Math.round(y),w,h);
else c.fillRect(Math.round(x*2)*.5,Math.round(y*2)*.5,w,h)};
const L=(x0,y0,x1,y1,k,w=1)=>{const g=GR,v=1/g;x0=Math.round(x0*v);y0=Math.round(y0*v);x1=Math.round(x1*v);y1=Math.round(y1*v);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(;;){R(x0*g,y0*g,w,w,k);if(x0==x1&&y0==y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}};
const O=(cx,cy,rx,ry,k)=>{const g=GR;for(let y=-ry;y<=ry;y+=g){const w=Math.round(rx*Math.sqrt(Math.max(0,1-y*y/(ry*ry)))/g)*g;R(cx-w,cy+y,w*2+g,g,k)}};
const T=(s,x,y,k,sz=8,al='left')=>{const f='bold '+sz+'px monospace';if(c.__f!==f){c.font=f;c.__f=f}
if(c.__a!==al){c.textAlign=al;c.__a=al}c.fillStyle='#000';c.fillText(s,x+1,y+1);c.fillStyle=k;c.__s=k;c.fillText(s,x,y)};
let SPD=1;const rnd=n=>Math.floor(Math.random()*n),wait=ms=>new Promise(r=>setTimeout(r,Math.max(8,ms*SPD)));

let AC=null,SFXV=1,MUSV=1,MUSID=0,MUSNOW=null;

function introMarca(){return new Promise(res=>{
 let vista=0;try{vista=localStorage.getItem('ra_marca')=='1'?1:0}catch(e){}
 const k=vista?.5:1,T=[];let fin=0;
 const esp=ms=>new Promise(r=>T.push(setTimeout(r,Math.max(40,ms*k))));
 const cerrar=()=>{if(fin)return;fin=1;T.forEach(clearTimeout);
  LUN.hidden=true;LUN.className='';
  removeEventListener('keydown',salta,true);removeEventListener('pointerdown',salta,true);
  try{localStorage.setItem('ra_marca','1')}catch(e){}res()};
 const salta=e=>{if(e&&e.preventDefault)e.preventDefault();cerrar()};
 LUN.hidden=false;LUN.className='p1';
 addEventListener('keydown',salta,true);addEventListener('pointerdown',salta,true);
 const mando=setInterval(()=>{try{const g=(navigator.getGamepads&&navigator.getGamepads())||[];
  for(const q of g)if(q&&q.buttons&&q.buttons.some(x=>x.pressed))return cerrar()}catch(e){}},90);
 T.push(mando);
 (async()=>{
  await esp(40);if(fin)return;LUN.classList.add('on');
  await esp(600+1400);if(fin)return;LUN.classList.remove('on');
  await esp(600);if(fin)return;LUN.className='p2';
  await esp(60);if(fin)return;LUN.classList.add('on');
  await esp(800+2000);if(fin)return;LUN.classList.remove('on');
  await esp(800);if(fin)return;
  clearInterval(mando);cerrar()})()})}
function titleOn(){mode='title';cv.width=CBW*PS;cv.height=CBH*PS;init();document.body.classList.add('ti');TI.hidden=false;music('titulo');menu('main')}

CUR=sl;save();mban('Guardado en la ranura '+sl,'rgba(30,140,70,.95)');bz=false;hint();return}
if(c=='rs'){if(await amenu('Perder\u00e1s todo lo que no hayas guardado. \u00bfReiniciar la misi\u00f3n?',[{t:'S\u00cd, REINICIAR'},{t:'NO, VOLVER'}]))continue;bz=false;newGame(CAP);return}
if(c=='ti'){if(await amenu('Perder\u00e1s todo lo que no hayas guardado. \u00bfVolver al t\u00edtulo?',[{t:'S\u00cd, SALIR'},{t:'NO, VOLVER'}]))continue;bz=false;titleOn();return}}}
const AYUDA='CONTROLES\n\n\u2022 Toca un palad\u00edn para elegirlo, o usa \u27a4 para ir pasando entre los que a\u00fan no han actuado.\n\u2022 Toca una casilla azul para moverte: al llegar se abre el men\u00fa de acciones.\n\u2022 Toca al propio palad\u00edn para actuar sin moverte.\n\u2022 Toca una casilla vac\u00eda para abrir el men\u00fa de campo: estado de las tropas, qui\u00e9n queda por mover y fin de turno.\n\u2022 Arrastra el mapa para mirar alrededor.\n\u2022 Mant\u00e9n pulsado sobre cualquier unidad para ver sus datos.\n\u2022 La flecha dorada marca siempre tu objetivo.\n\u2022 Toca una ara\u00f1a para ver en rojo hasta d\u00f3nde puede llegar y morder.\n\u2022 Antes de atacar, cada arma te dice cu\u00e1nto haces y si la matas: dorado es seguro, \u00e1mbar es con suerte.\n\u2022 Cada palad\u00edn lleva su arma propia con 7 usos, que se recarga al empezar cada nivel. La lanza b\u00e1sica no se gasta nunca.\n\u2022 Las armas extra son de un solo uso. Las sueltan las ara\u00f1as o se compran a Tom\u00e1s entre cap\u00edtulos. Con DAR se pasan a quien tengas al lado, sin gastar el turno.\n\u2022 El oro se cobra una sola vez por cada ara\u00f1a y cada objetivo de un cap\u00edtulo: repetir solo paga lo que no hab\u00edas hecho.\n\u2022 En modo normal, quien cae se queda en el suelo. Ac\u00e9rcate y elige RECOGER antes de 10 turnos, y aguanta otros 10 carg\u00e1ndolo.\n\u2022 Las puertas con marco dorado activan misiones.\n\u2022 El bot\u00f3n \u2630 de arriba a la derecha abre el men\u00fa para guardar la partida.\n\u2022 Pellizca con dos dedos, o usa la rueda del rat\u00f3n, para acercar y alejar el mapa.\n\nTECLADO\n\n\u2022 Flechas o WASD mueven el cursor.\n\u2022 Z confirma. X cancela.\n\u2022 Espacio pasa al siguiente palad\u00edn. Q y E saltan de uno a otro.\n\u2022 C abre el men\u00fa de campo. Enter abre el men\u00fa principal.\n\u2022 Tab lleva el cursor al objetivo.\n\u2022 + acerca la c\u00e1mara, - la aleja, 0 la deja como estaba.\n\u2022 Cualquier tecla avanza los di\u00e1logos.\n\nMANDO\n\n\u2022 Cruceta o palanca izquierda mueven el cursor; la derecha, la c\u00e1mara.\n\u2022 A confirma, B cancela, X cambia de unidad, Y abre el men\u00fa de campo.\n\u2022 LB y RB saltan entre paladines.\n\u2022 LT aleja la c\u00e1mara y RT la acerca, seg\u00fan lo que aprietes.\n\u2022 Select va al objetivo y L3 a la ara\u00f1a m\u00e1s cercana.\n\u2022 Start abre el men\u00fa principal.';

const left=units.filter(u=>u.t=='p'&&u.hp>0&&!u.done).length;

endTurn()}

 bz=true;
 try{for(;;){

  if(c=='es'){const l=esp.concat();
   const q=l.map(u=>({t:u.n+' \u00b7 HP '+u.hp+'/'+u.mx})).concat([{t:'\u25c0 VOLVER'}]);
   const i=await amenu('Sin mover todav\u00eda',q);if(i<l.length){bz=false;irA(l[i]);return}continue}
  const L=units.filter(u=>u.t=='p');

   .concat([{t:'\u25c0 VOLVER'}]);
  const i=await amenu('Estado de las tropas',q);

 }}finally{bz=false}}
